  tools: [ arcmira, yt-dlp, ffmpeg, demucs, whisper, librosa, openrouter ]
  repos: [ ByteDance-Seed/SeedVR, hzwer/Practical-RIFE ]
  notes: A beat-for-beat remake of a 30 s basketball edit with Dylan Patel swapped in by Wan 3.0 video-to-video from a GPT Image 2.5 Sunburst character sheet, a newspaper rendered in headless Chrome, and a podcast section where every clip was found by an Arcmira MCP search shown on screen. OpenCV and MediaPipe did the face tracking and mattes, and SeedVR2 7B on Modal upscaled six shots.
