audio:
  tracks:
    - title: How it go
      artist: Yeat
      role: music
      source: existing
    - title: Announcer lines
      role: voiceover
      source: recorded
      generator: human
process:
  guide: [ https://github.com/zealous1/dylan-patel-hype-edit ]
  steps:
    - part: research
      tool: ffmpeg
      did: Measured every cut, flash and flicker of the reference edit frame by frame before looking at it.
      source: https://github.com/zealous1/dylan-patel-hype-edit/blob/master/RECIPE.md#1-measure-the-reference
    - part: research
      tool: arcmira
      did: Found each podcast beat with an Arcmira search, most on Dylan's speaker id, one episode per beat, and printed the search on screen.
      source: https://github.com/zealous1/dylan-patel-hype-edit/blob/master/RECIPE.md#2-find-every-podcast-beat-by-search
    - part: vocals
      tool: demucs
      did: Kept the original mix and replaced only the announcer's words with Zeal's own recorded lines.
      source: https://github.com/zealous1/dylan-patel-hype-edit/blob/master/RECIPE.md#3-swap-only-the-announcers-words
    - part: stills
      tool: openrouter
      did: Built a six-view character sheet, then a start and end frame for every swapped shot.
      source: https://github.com/zealous1/dylan-patel-hype-edit/blob/master/RECIPE.md#4-draw-the-character-sheet-and-the-start-frames
    - part: motion
      model: wan-3-0
      did: Swapped Dylan into each shot by video-to-video, with the slowed source span, the sheet and both frames as references.
      source: https://github.com/zealous1/dylan-patel-hype-edit/blob/master/RECIPE.md#5-swap-dylan-in-shot-by-shot
    - part: edit
      tool: claude-code
      did: Graded each generated take frame by frame to match the reference and redrew the scorebug and banners in code.
      source: https://github.com/zealous1/dylan-patel-hype-edit/blob/master/RECIPE.md#6-grade-every-take-to-the-reference
    - part: graphics
      tool: claude-code
      did: Rendered the newspaper as an HTML canvas page, frame by frame in headless Chrome.
      source: https://github.com/zealous1/dylan-patel-hype-edit/blob/master/RECIPE.md#7-render-the-newspaper
    - part: edit
      tool: claude-code
      did: Cut ten podcast clips, nine of Dylan and one of Jensen, into 7 s with a face-matched zoom-through and a halation wrap on a person matte.
      source: https://github.com/zealous1/dylan-patel-hype-edit/blob/master/RECIPE.md#8-cut-the-podcast-section
    - part: render
      did: Upscaled the six softest shots with SeedVR2 7B at 1440, then Lanczos to 1080.
      source: https://github.com/zealous1/dylan-patel-hype-edit/blob/master/RECIPE.md#10-upscale-the-soft-shots
    - part: render
      tool: ffmpeg
      did: Assembled at 30 fps with a film look borrowed from the reference's flicker and a name-burn opener.
      source: https://github.com/zealous1/dylan-patel-hype-edit/blob/master/RECIPE.md#11-assemble-add-the-film-look-and-the-opener
  time_spent: Two days, 16 to 17 Oct 2026 (Pacific)
  cost: $21.54 of logged image and video generation plus $11.95 of logged GPU time (SeedVR2 and RIFE on Modal). Claude Code used 3,040 Claude Opus 5.5 replies across the main chat and 24 helper agents, with 2.6M output tokens and 652M cache-read tokens. Claude Code ran on one Claude subscription; at Claude API list prices the tokens would come to about $278.
